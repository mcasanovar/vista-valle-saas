<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Source+Sans+3:wght@400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Source Sans 3', system-ui, sans-serif; }
    a { color: #3d4fb8; text-decoration: none; }

    .p1t-icon { transition: background-color 150ms ease, color 150ms ease; }
    .p1t-icon:hover { background-color: #2a3444; }
    .p1t-card { transition: box-shadow 180ms ease; }
    .p1t-card:hover { box-shadow: 0 4px 16px rgba(20,24,38,0.08); }
    .p1t-row { transition: background-color 150ms ease; }
    .p1t-row:hover { background-color: #f7f8fb; }
    .p1t-btn { transition: background-color 150ms ease; }
    .p1t-btn:hover { background-color: #2c3a94; }
    .p1t-btn:disabled { opacity: 0.75; }
    .p1t-fade { animation: p1tFadeIn 320ms ease both; }
    .p1t-fade:nth-child(2) { animation-delay: 40ms; }
    .p1t-fade:nth-child(3) { animation-delay: 80ms; }
    .p1t-fade:nth-child(4) { animation-delay: 120ms; }
    @keyframes p1tFadeIn { from { opacity:0; transform: translateY(6px);} to { opacity:1; transform:translateY(0);} }

    .p1t-skel { background: linear-gradient(90deg, #e7e9ef 25%, #f1f2f6 37%, #e7e9ef 63%); background-size: 400% 100%; animation: p1tShimmer 1.4s ease infinite; border-radius: 6px; }
    @keyframes p1tShimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
    .p1t-spin { animation: p1tSpin 800ms linear infinite; }
    @keyframes p1tSpin { to { transform: rotate(360deg); } }
    .p1t-badge { display:inline-flex; align-items:center; padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:700; }
  </style>
</helmet>

<div style="width:834px; min-height:1194px; background:#f4f5f8; display:flex; color:#1c2130;">

  <!-- Icon rail -->
  <aside style="width:64px; flex-shrink:0; background:#1c2434; padding:16px 0; display:flex; flex-direction:column; align-items:center; gap:6px;">
    <div style="width:32px;height:32px;border-radius:8px;background:#3d4fb8; display:flex; align-items:center; justify-content:center; margin-bottom:14px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V9l9-6 9 6v12"/><path d="M9 21v-8h6v8"/></svg>
    </div>
    <a href="#" class="p1t-icon" style="width:40px;height:40px;border-radius:9px;background:#2a3444; display:flex; align-items:center; justify-content:center; color:#eef0f6;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
    </a>
    <a href="#" class="p1t-icon" style="width:40px;height:40px;border-radius:9px; display:flex; align-items:center; justify-content:center; color:#b6bcce;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    </a>
    <a href="#" class="p1t-icon" style="width:40px;height:40px;border-radius:9px; display:flex; align-items:center; justify-content:center; color:#b6bcce;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    </a>
    <a href="#" class="p1t-icon" style="width:40px;height:40px;border-radius:9px; display:flex; align-items:center; justify-content:center; color:#b6bcce;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M2 21v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2"/></svg>
    </a>
    <a href="#" class="p1t-icon" style="width:40px;height:40px;border-radius:9px; display:flex; align-items:center; justify-content:center; color:#b6bcce;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
    </a>
    <a href="#" class="p1t-icon" style="width:40px;height:40px;border-radius:9px; display:flex; align-items:center; justify-content:center; color:#b6bcce;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
    </a>
    <a href="#" class="p1t-icon" style="width:40px;height:40px;border-radius:9px; display:flex; align-items:center; justify-content:center; color:#b6bcce;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
    </a>
    <a href="#" class="p1t-icon" style="width:40px;height:40px;border-radius:9px; display:flex; align-items:center; justify-content:center; color:#b6bcce; position:relative;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>
      <span style="position:absolute; top:5px; right:6px; width:7px; height:7px; border-radius:999px; background:#c25b4c; border:1.5px solid #1c2434;"></span>
    </a>
    <a href="#" class="p1t-icon" style="width:40px;height:40px;border-radius:9px; display:flex; align-items:center; justify-content:center; color:#b6bcce;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4"/></svg>
    </a>
    <div style="margin-top:auto; width:32px;height:32px;border-radius:999px;background:#3d4fb8; color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700;">MR</div>
  </aside>

  <!-- Content -->
  <main style="flex:1; padding:22px 22px 28px; display:flex; flex-direction:column; gap:18px;">
    <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px;">
      <div>
        <h1 style="font-family:'Manrope',sans-serif; font-size:19px; font-weight:800; margin:0; color:#181d2b;">Resumen operativo</h1>
        <p style="margin:4px 0 0; font-size:12.5px; color:#6b7288;">Martes, 25 de agosto</p>
      </div>
      <button
        class="p1t-btn"
        onClick="{{ toggleLoading }}"
        disabled="{{ loading }}"
        style="height:36px; padding:0 14px; border-radius:8px; border:none; background:#3d4fb8; color:#fff; font-size:12.5px; font-weight:700; display:flex; align-items:center; gap:7px; cursor:pointer; flex-shrink:0;"
      >
        <sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}">
          <svg class="p1t-spin" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-9-9"/></svg>
        </sc-if>
        {{ refreshLabel }}
      </button>
    </div>

    <sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}">
      <div style="display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:14px;">
        <div style="background:#fff; border:1px solid #e6e8ef; border-radius:12px; padding:16px;"><div class="p1t-skel" style="width:80px;height:11px;margin-bottom:12px;"></div><div class="p1t-skel" style="width:90px;height:22px;"></div></div>
        <div style="background:#fff; border:1px solid #e6e8ef; border-radius:12px; padding:16px;"><div class="p1t-skel" style="width:80px;height:11px;margin-bottom:12px;"></div><div class="p1t-skel" style="width:90px;height:22px;"></div></div>
        <div style="background:#fff; border:1px solid #e6e8ef; border-radius:12px; padding:16px;"><div class="p1t-skel" style="width:80px;height:11px;margin-bottom:12px;"></div><div class="p1t-skel" style="width:90px;height:22px;"></div></div>
        <div style="background:#fff; border:1px solid #e6e8ef; border-radius:12px; padding:16px;"><div class="p1t-skel" style="width:80px;height:11px;margin-bottom:12px;"></div><div class="p1t-skel" style="width:90px;height:22px;"></div></div>
      </div>
    </sc-if>
    <sc-if value="{{ notLoading }}" hint-placeholder-val="{{ true }}">
      <div style="display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:14px;">
        <sc-for list="{{ kpis }}" as="kpi" hint-placeholder-count="4">
          <div class="p1t-card p1t-fade" style="background:#fff; border:1px solid #e6e8ef; border-radius:12px; padding:16px;">
            <div style="font-size:12px; color:#6b7288; font-weight:600;">{{ kpi.label }}</div>
            <div style="display:flex; align-items:baseline; gap:7px; margin-top:7px;">
              <div style="font-family:'Manrope',sans-serif; font-size:23px; font-weight:800; color:#181d2b;">{{ kpi.value }}</div>
              <div style="font-size:12px; font-weight:700; color:{{ kpi.trendColor }};">{{ kpi.trend }}</div>
            </div>
          </div>
        </sc-for>
      </div>
    </sc-if>

    <div style="background:#fff; border:1px solid #e6e8ef; border-radius:12px; overflow:hidden;">
      <div style="display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid #eef0f5;">
        <div style="font-family:'Manrope',sans-serif; font-weight:700; font-size:14px; color:#181d2b;">Reservas recientes</div>
        <a href="#" style="font-size:12.5px; font-weight:600;">Ver todas →</a>
      </div>

      <sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex; align-items:center; justify-content:space-between; padding:13px 18px; border-bottom:1px solid #f2f3f7;">
          <div><div class="p1t-skel" style="width:140px;height:12px;margin-bottom:6px;"></div><div class="p1t-skel" style="width:100px;height:11px;"></div></div>
          <div class="p1t-skel" style="width:70px;height:19px;border-radius:999px;"></div>
        </div>
        <div style="display:flex; align-items:center; justify-content:space-between; padding:13px 18px; border-bottom:1px solid #f2f3f7;">
          <div><div class="p1t-skel" style="width:160px;height:12px;margin-bottom:6px;"></div><div class="p1t-skel" style="width:100px;height:11px;"></div></div>
          <div class="p1t-skel" style="width:70px;height:19px;border-radius:999px;"></div>
        </div>
        <div style="display:flex; align-items:center; justify-content:space-between; padding:13px 18px;">
          <div><div class="p1t-skel" style="width:120px;height:12px;margin-bottom:6px;"></div><div class="p1t-skel" style="width:100px;height:11px;"></div></div>
          <div class="p1t-skel" style="width:70px;height:19px;border-radius:999px;"></div>
        </div>
      </sc-if>
      <sc-if value="{{ notLoading }}" hint-placeholder-val="{{ true }}">
        <sc-for list="{{ rows }}" as="row" hint-placeholder-count="5">
          <div class="p1t-row" style="display:flex; align-items:center; justify-content:space-between; padding:13px 18px; border-bottom:1px solid #f2f3f7;">
            <div>
              <div style="font-weight:600; font-size:13.5px; color:#1c2130;">{{ row.guest }}</div>
              <div style="font-size:12px; color:#6b7288; margin-top:2px;">{{ row.room }} · {{ row.checkin }} – {{ row.checkout }}</div>
            </div>
            <div style="display:flex; align-items:center; gap:14px;">
              <span class="p1t-badge" style="background:{{ row.statusBg }}; color:{{ row.statusColor }};">{{ row.status }}</span>
              <div style="font-weight:700; font-size:13.5px; width:58px; text-align:right;">{{ row.amount }}</div>
            </div>
          </div>
        </sc-for>
      </sc-if>
    </div>
  </main>
</div>
</x-dc>
<script data-dc-script data-props='{"loading":{"editor":"boolean","default":false,"section":"Estado"}}'>
class Component extends DCLogic {
  renderVals() {
    const loading = this.props.loading ?? false;
    const toggleLoading = () => this.setState({});
    const kpis = [
      { label: 'Ocupación hoy', value: '78%', trend: '+4%', trendColor: '#2f8f5b' },
      { label: 'Reservas activas', value: '42', trend: '+6', trendColor: '#2f8f5b' },
      { label: 'Pagos pendientes', value: '$18,450', trend: '-2', trendColor: '#c25b4c' },
      { label: 'Alertas abiertas', value: '3', trend: '0', trendColor: '#8b91a4' },
    ];
    const rows = [
      { guest: 'Andrea Solís', room: 'Suite 204', checkin: '25 ago', checkout: '28 ago', status: 'Confirmada', statusBg: '#e6f4ea', statusColor: '#2f8f5b', amount: '$4,200' },
      { guest: 'Diego Fernández', room: 'Doble 112', checkin: '25 ago', checkout: '26 ago', status: 'Pendiente', statusBg: '#fdf1e2', statusColor: '#b5702a', amount: '$1,150' },
      { guest: 'Carla Jiménez', room: 'Suite 301', checkin: '26 ago', checkout: '30 ago', status: 'Confirmada', statusBg: '#e6f4ea', statusColor: '#2f8f5b', amount: '$6,800' },
      { guest: 'Roberto Peña', room: 'Individual 05', checkin: '27 ago', checkout: '27 ago', status: 'Cancelada', statusBg: '#fbe9e7', statusColor: '#c25b4c', amount: '$0' },
      { guest: 'Sofía Aguilar', room: 'Doble 108', checkin: '27 ago', checkout: '29 ago', status: 'Confirmada', statusBg: '#e6f4ea', statusColor: '#2f8f5b', amount: '$2,900' },
    ];
    return { loading, notLoading: !loading, refreshLabel: loading ? 'Actualizando…' : 'Actualizar', toggleLoading, kpis, rows };
  }
}
</script>
</body>
</html>
