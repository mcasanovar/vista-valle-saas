<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Source+Sans+3:wght@400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Source Sans 3', system-ui, sans-serif; }
    a { color: #3d4fb8; text-decoration: none; }

    .p1m-card { transition: box-shadow 180ms ease; }
    .p1m-card:hover { box-shadow: 0 4px 16px rgba(20,24,38,0.08); }
    .p1m-btn { transition: background-color 150ms ease; }
    .p1m-btn:hover { background-color: #2c3a94; }
    .p1m-btn:disabled { opacity: 0.75; }
    .p1m-navitem { transition: color 150ms ease; }
    .p1m-fade { animation: p1mFadeIn 300ms ease both; }
    .p1m-fade:nth-child(2) { animation-delay: 40ms; }
    .p1m-fade:nth-child(3) { animation-delay: 80ms; }
    .p1m-fade:nth-child(4) { animation-delay: 120ms; }
    @keyframes p1mFadeIn { from { opacity:0; transform: translateY(6px);} to { opacity:1; transform:translateY(0);} }

    .p1m-skel { background: linear-gradient(90deg, #e7e9ef 25%, #f1f2f6 37%, #e7e9ef 63%); background-size: 400% 100%; animation: p1mShimmer 1.4s ease infinite; border-radius: 6px; }
    @keyframes p1mShimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
    .p1m-spin { animation: p1mSpin 800ms linear infinite; }
    @keyframes p1mSpin { to { transform: rotate(360deg); } }
    .p1m-badge { display:inline-flex; align-items:center; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:700; }
  </style>
</helmet>

<div style="width:390px; height:844px; background:#f4f5f8; color:#1c2130; display:flex; flex-direction:column; overflow:hidden;">

  <!-- Top bar -->
  <header style="flex-shrink:0; background:#1c2434; padding:14px 16px 16px; display:flex; flex-direction:column; gap:10px;">
    <div style="display:flex; align-items:center; justify-content:space-between;">
      <div style="display:flex; align-items:center; gap:9px;">
        <div style="width:28px;height:28px;border-radius:7px;background:#3d4fb8; display:flex; align-items:center; justify-content:center;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V9l9-6 9 6v12"/><path d="M9 21v-8h6v8"/></svg>
        </div>
        <div style="font-family:'Manrope',sans-serif; font-weight:800; font-size:16px; color:#f2f3f7;">Vista Valle</div>
      </div>
      <div style="width:28px;height:28px;border-radius:999px;background:#3d4fb8; color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700;">MR</div>
    </div>
    <div>
      <div style="font-family:'Manrope',sans-serif; font-size:19px; font-weight:800; color:#fff;">Resumen operativo</div>
      <div style="font-size:13px; color:#9aa1b8; margin-top:2px;">Martes, 25 de agosto</div>
    </div>
  </header>

  <!-- Content -->
  <main style="flex:1; padding:16px 16px 12px; display:flex; flex-direction:column; gap:16px; overflow-y:auto;">

    <button
      class="p1m-btn"
      onClick="{{ toggleLoading }}"
      disabled="{{ loading }}"
      style="height:42px; border-radius:10px; border:none; background:#3d4fb8; color:#fff; font-size:16px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;"
    >
      <sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}">
        <svg class="p1m-spin" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-9-9"/></svg>
      </sc-if>
      <sc-if value="{{ notLoading }}" hint-placeholder-val="{{ true }}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
      </sc-if>
      {{ refreshLabel }}
    </button>

    <sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}">
      <div style="display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:12px;">
        <div style="background:#fff; border:1px solid #e6e8ef; border-radius:12px; padding:14px;"><div class="p1m-skel" style="width:70px;height:10px;margin-bottom:10px;"></div><div class="p1m-skel" style="width:80px;height:20px;"></div></div>
        <div style="background:#fff; border:1px solid #e6e8ef; border-radius:12px; padding:14px;"><div class="p1m-skel" style="width:70px;height:10px;margin-bottom:10px;"></div><div class="p1m-skel" style="width:80px;height:20px;"></div></div>
        <div style="background:#fff; border:1px solid #e6e8ef; border-radius:12px; padding:14px;"><div class="p1m-skel" style="width:70px;height:10px;margin-bottom:10px;"></div><div class="p1m-skel" style="width:80px;height:20px;"></div></div>
        <div style="background:#fff; border:1px solid #e6e8ef; border-radius:12px; padding:14px;"><div class="p1m-skel" style="width:70px;height:10px;margin-bottom:10px;"></div><div class="p1m-skel" style="width:80px;height:20px;"></div></div>
      </div>
    </sc-if>
    <sc-if value="{{ notLoading }}" hint-placeholder-val="{{ true }}">
      <div style="display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:12px;">
        <sc-for list="{{ kpis }}" as="kpi" hint-placeholder-count="4">
          <div class="p1m-card p1m-fade" style="background:#fff; border:1px solid #e6e8ef; border-radius:12px; padding:14px;">
            <div style="font-size:13px; color:#6b7288; font-weight:600;">{{ kpi.label }}</div>
            <div style="display:flex; align-items:baseline; gap:6px; margin-top:6px;">
              <div style="font-family:'Manrope',sans-serif; font-size:23px; font-weight:800; color:#181d2b;">{{ kpi.value }}</div>
              <div style="font-size:11px; font-weight:700; color:{{ kpi.trendColor }};">{{ kpi.trend }}</div>
            </div>
          </div>
        </sc-for>
      </div>
    </sc-if>

    <div>
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
        <div style="font-family:'Manrope',sans-serif; font-weight:700; font-size:16px; color:#181d2b;">Reservas recientes</div>
        <a href="#" style="font-size:13px; font-weight:600;">Ver todas</a>
      </div>

      <sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex; flex-direction:column; gap:10px;">
          <div style="background:#fff; border:1px solid #e6e8ef; border-radius:12px; padding:14px;">
            <div class="p1m-skel" style="width:140px;height:12px;margin-bottom:8px;"></div>
            <div class="p1m-skel" style="width:110px;height:11px;margin-bottom:12px;"></div>
            <div style="display:flex; justify-content:space-between;"><div class="p1m-skel" style="width:60px;height:18px;border-radius:999px;"></div><div class="p1m-skel" style="width:50px;height:12px;"></div></div>
          </div>
          <div style="background:#fff; border:1px solid #e6e8ef; border-radius:12px; padding:14px;">
            <div class="p1m-skel" style="width:160px;height:12px;margin-bottom:8px;"></div>
            <div class="p1m-skel" style="width:110px;height:11px;margin-bottom:12px;"></div>
            <div style="display:flex; justify-content:space-between;"><div class="p1m-skel" style="width:60px;height:18px;border-radius:999px;"></div><div class="p1m-skel" style="width:50px;height:12px;"></div></div>
          </div>
          <div style="background:#fff; border:1px solid #e6e8ef; border-radius:12px; padding:14px;">
            <div class="p1m-skel" style="width:120px;height:12px;margin-bottom:8px;"></div>
            <div class="p1m-skel" style="width:110px;height:11px;margin-bottom:12px;"></div>
            <div style="display:flex; justify-content:space-between;"><div class="p1m-skel" style="width:60px;height:18px;border-radius:999px;"></div><div class="p1m-skel" style="width:50px;height:12px;"></div></div>
          </div>
        </div>
      </sc-if>
      <sc-if value="{{ notLoading }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex; flex-direction:column; gap:10px;">
          <sc-for list="{{ rows }}" as="row" hint-placeholder-count="4">
            <div class="p1m-card" style="background:#fff; border:1px solid #e6e8ef; border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:8px;">
              <div style="display:flex; align-items:center; justify-content:space-between;">
                <div style="font-weight:700; font-size:16px; color:#1c2130;">{{ row.guest }}</div>
                <span class="p1m-badge" style="background:{{ row.statusBg }}; color:{{ row.statusColor }};">{{ row.status }}</span>
              </div>
              <div style="font-size:13px; color:#6b7288;">{{ row.room }} · {{ row.checkin }} – {{ row.checkout }}</div>
              <div style="font-weight:700; font-size:16px; color:#181d2b;">{{ row.amount }}</div>
            </div>
          </sc-for>
        </div>
      </sc-if>
    </div>
  </main>

  <!-- Bottom nav -->
  <nav style="flex-shrink:0; background:#fff; border-top:1px solid #e6e8ef; display:flex; align-items:center; justify-content:space-around; padding:8px 4px calc(8px + env(safe-area-inset-bottom, 0px));">
    <a href="#" class="p1m-navitem" style="display:flex; flex-direction:column; align-items:center; gap:3px; color:#3d4fb8; font-size:11px; font-weight:700;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
      Resumen
    </a>
    <a href="#" class="p1m-navitem" style="display:flex; flex-direction:column; align-items:center; gap:3px; color:#8890a6; font-size:11px; font-weight:600;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      Calendario
    </a>
    <a href="#" class="p1m-navitem" style="display:flex; flex-direction:column; align-items:center; gap:3px; color:#8890a6; font-size:11px; font-weight:600;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      Reservas
    </a>
    <a href="#" class="p1m-navitem" style="display:flex; flex-direction:column; align-items:center; gap:3px; color:#8890a6; font-size:11px; font-weight:600; position:relative;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>
      <span style="position:absolute; top:-2px; right:6px; width:7px; height:7px; border-radius:999px; background:#c25b4c; border:1.5px solid #fff;"></span>
      Alertas
    </a>
    <a href="#" class="p1m-navitem" style="display:flex; flex-direction:column; align-items:center; gap:3px; color:#8890a6; font-size:11px; font-weight:600;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      Más
    </a>
  </nav>
</div>
</x-dc>
<script data-dc-script data-props='{"loading":{"editor":"boolean","default":false,"section":"Estado"}}'>
class Component extends DCLogic {
  renderVals() {
    const loading = this.props.loading ?? false;
    const toggleLoading = () => this.setState({});
    const kpis = [
      { label: 'Ocupación', value: '78%', trend: '+4%', trendColor: '#2f8f5b' },
      { label: 'Reservas', value: '42', trend: '+6', trendColor: '#2f8f5b' },
      { label: 'Pagos pend.', value: '$18.4k', trend: '-2', trendColor: '#c25b4c' },
      { label: 'Alertas', value: '3', trend: '0', trendColor: '#8b91a4' },
    ];
    const rows = [
      { guest: 'Andrea Solís', room: 'Suite 204', checkin: '25 ago', checkout: '28 ago', status: 'Confirmada', statusBg: '#e6f4ea', statusColor: '#2f8f5b', amount: '$4,200' },
      { guest: 'Diego Fernández', room: 'Doble 112', checkin: '25 ago', checkout: '26 ago', status: 'Pendiente', statusBg: '#fdf1e2', statusColor: '#b5702a', amount: '$1,150' },
      { guest: 'Carla Jiménez', room: 'Suite 301', checkin: '26 ago', checkout: '30 ago', status: 'Confirmada', statusBg: '#e6f4ea', statusColor: '#2f8f5b', amount: '$6,800' },
      { guest: 'Roberto Peña', room: 'Individual 05', checkin: '27 ago', checkout: '27 ago', status: 'Cancelada', statusBg: '#fbe9e7', statusColor: '#c25b4c', amount: '$0' },
    ];
    return { loading, notLoading: !loading, refreshLabel: loading ? 'Actualizando…' : 'Actualizar datos', toggleLoading, kpis, rows };
  }
}
</script>
</body>
</html>
